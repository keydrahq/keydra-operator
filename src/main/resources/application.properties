# The manager's own configuration. Nothing an installation is configured with lives here —
# that is what the custom resource is for.

quarkus.application.name=keydra-operator

# ---------------------------------------------------------------------------------------
# What a resource that names no version gets
# ---------------------------------------------------------------------------------------
#
# The operator's version and Keydra's move independently, and this is the seam between them.
# An operator release that only fixes a reconciler does not make a new Keydra, so a bump here
# is a deliberate act: it changes what every installation that has not pinned a version runs.
keydra.default-version=0.0.1

# ---------------------------------------------------------------------------------------
# The CRDs
# ---------------------------------------------------------------------------------------
#
# Generated from the classes on every build, so a field that exists in Java and not in the
# CRD is a thing that cannot happen.
quarkus.operator-sdk.crd.generate=true

# Applied by the manager only in development. In a cluster the CRDs are installed by whatever
# installed the operator — OLM from the bundle, or kubectl from target/kubernetes — and a
# manager that wrote its own would need cluster-wide write on CRDs for the life of the
# deployment to do something that happens once.
quarkus.operator-sdk.crd.apply=false
%dev.quarkus.operator-sdk.crd.apply=true

# Not validated at startup, which is a permission rather than a preference: validating means
# reading CustomResourceDefinition cluster-wide for the life of the deployment, to check a fact
# that was settled when the CRDs were installed. In development, where the manager applies them
# itself, checking is free and worth it.
quarkus.operator-sdk.crd.validate=false
%dev.quarkus.operator-sdk.crd.validate=true

# ---------------------------------------------------------------------------------------
# What it watches
# ---------------------------------------------------------------------------------------
#
# Every namespace by default, which is what the AllNamespaces install mode means. OLM sets
# WATCH_NAMESPACE for the other two modes and the framework reads it, so this is a default
# rather than a decision made here.
quarkus.operator-sdk.namespaces=JOSDK_ALL_NAMESPACES

# Reconcile everything periodically as well as on events. Most of what an installation owns
# is watched, but two things are not: the Secret it reads its credentials from, and whatever
# is behind a KeydraConnection's host. So a Secret that gains its missing key, or a target
# that comes back, is noticed within the hour rather than on the next unrelated event.
quarkus.operator-sdk.controllers."keydra".max-reconciliation-interval=1h
quarkus.operator-sdk.controllers."keydraconnection".max-reconciliation-interval=10m

# ---------------------------------------------------------------------------------------
# The OLM bundle
# ---------------------------------------------------------------------------------------
quarkus.operator-sdk.bundle.package-name=keydra-operator
quarkus.operator-sdk.bundle.channels=alpha
quarkus.operator-sdk.bundle.default-channel=alpha

# ---------------------------------------------------------------------------------------
# The manager's own surface
# ---------------------------------------------------------------------------------------
#
# Health and metrics on the management port and nothing on the main one, for the same reason
# the application does it: what they say is a map of what is installed, and the audience for
# that is a scraper inside the cluster.
quarkus.management.enabled=true
quarkus.management.port=8080
quarkus.http.port=8081

quarkus.operator-sdk.enable-ssa=true

# Where the plain-kubectl install puts the manager. OLM ignores this and installs into whichever
# namespace the subscription names; it exists so that the ClusterRoleBindings in
# target/kubernetes name a real ServiceAccount instead of one in "".
quarkus.kubernetes.namespace=keydra-operator

# What the CSV's deployment and the manifests pull. Without this the container-image extension
# names the image after whoever ran the build, and a bundle that installs one developer's
# account is a bundle that installs nothing on anybody else's cluster.
quarkus.container-image.registry=quay.io
quarkus.container-image.group=keydrahq
quarkus.container-image.name=keydra-operator

# JSON on the console where a log shipper reads it, and the ordinary format in development.
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
quarkus.log.category."io.keydra.operator".level=INFO

# The REST client the KeydraConnection reconciler uses. A reconciliation that hangs on a
# target's console is a reconciliation that holds a thread until somebody notices.
quarkus.rest-client.connect-timeout=5000
quarkus.rest-client.read-timeout=30000
