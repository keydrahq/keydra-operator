name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the chart beside this repository
        uses: actions/checkout@v7
        with:
          repository: keydrahq/keydra-helm
          path: keydra-helm-checkout

      - name: Put it where the test looks
        run: mv keydra-helm-checkout ../keydra-helm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Check what the generated CRDs actually say
        run: python3 scripts/check-crds.py

      - name: Upload the CRDs and the bundle
        uses: actions/upload-artifact@v7
        with:
          name: manifests
          path: |
            target/kubernetes/*.yml
            target/bundle/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  bundle:
    name: Validate the OLM bundle
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate the bundle
        run: ./mvnw -B -ntp package -DskipTests

      - name: Install operator-sdk
        run: |
          set -euo pipefail
          version=v1.42.0
          curl -sSLo operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/${version}/operator-sdk_linux_amd64"
          chmod +x operator-sdk
          sudo mv operator-sdk /usr/local/bin/

      - name: Validate
        run: |
          operator-sdk bundle validate ./target/bundle/keydra-operator \
            --select-optional suite=operatorframework
